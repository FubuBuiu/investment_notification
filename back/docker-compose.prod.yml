version: "3.9"

services:
  postgres:
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    networks:
      - backend
    tmpfs:
      - /tmp
    stop_grace_period: 1m

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt

networks:
  backend:
    driver: bridge
    internal: true
